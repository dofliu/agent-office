<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>投票</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070d17}
body{font-family:"Noto Sans TC","Noto Sans CJK TC","WenQuanYi Zen Hei","PingFang TC","Microsoft JhengHei",sans-serif;color:#e8eef7;position:relative;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:
 radial-gradient(670px 1421px at 24% 18%,rgba(45,212,191,.14),transparent 62%),
 radial-gradient(626px 1344px at 78% 82%,rgba(139,92,246,.15),transparent 60%),
 linear-gradient(160deg,#0d1b2e 0%,#070d17 58%,#05070d 100%)}
.aur{position:absolute;width:1498px;height:1498px;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(45,212,191,.32),transparent 62%);left:-24%;top:-30%;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(139,92,246,.30),transparent 62%);right:-27%;bottom:-32%;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(232,238,247,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(232,238,247,.5) 1px,transparent 1px);background-size:64px 64px}
.vig{position:absolute;inset:0;background:radial-gradient(896px 1786px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:6}
.stage{position:absolute;inset:0;z-index:4;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.04)}}
.foot{position:absolute;inset:0;width:1080px;height:1920px;z-index:1;display:block}
.kicker{font-size:28px;font-weight:700;letter-spacing:.42em;color:#2dd4bf;white-space:nowrap}
.h1{font-size:112px;font-weight:900;line-height:1.14;letter-spacing:.01em;
 background:linear-gradient(100deg,#f4f8ff 20%,#9be8db 55%,#c4b5fd 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 8px 40px rgba(45,212,191,.18))}
.h{font-size:72px;font-weight:900;line-height:1.12;white-space:nowrap;
 background:linear-gradient(100deg,#f4f8ff 20%,#9be8db 55%,#c4b5fd 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:34px;font-weight:500;color:rgba(232,238,247,.86);line-height:1.55}
.cap{font-size:30px;color:rgba(232,238,247,.85);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 32px;border-radius:999px;font-size:32px;font-weight:700;white-space:nowrap;
 background:rgba(20,32,52,.85);border:1.5px solid rgba(150,200,255,.24);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.tag{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;font-size:28px;font-weight:700;white-space:nowrap;
 background:rgba(10,18,32,.88);border:1.5px solid rgba(150,200,255,.3);box-shadow:0 12px 30px rgba(0,0,0,.45);color:#f4f8ff}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.badge{display:inline-block;padding:12px 26px;border-radius:12px;font-size:28px;font-weight:700;white-space:nowrap;
 background:rgba(45,212,191,.14);border:1.5px solid rgba(45,212,191,.45);color:#7ff0df}
.pic{position:absolute;border-radius:22px;overflow:hidden;background:#0b1220;border:1.5px solid rgba(150,200,255,.24);box-shadow:0 34px 90px rgba(0,0,0,.6)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.in{opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .75s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.fade{opacity:0;animation:fadein .8s ease both;animation-delay:var(--d,0s)}
@keyframes fadein{to{opacity:1}}
/* 疊在運鏡畫面上的字：深色漸層底 */
.shade{position:absolute;z-index:2;pointer-events:none}
.shade.b{left:0;right:0;bottom:0;height:883px;background:linear-gradient(0deg,rgba(5,9,16,.88) 0%,rgba(5,9,16,.55) 45%,transparent 100%)}
.shade.t{left:0;right:0;top:0;height:691px;background:linear-gradient(180deg,rgba(5,9,16,.82) 0%,rgba(5,9,16,.45) 50%,transparent 100%)}
.shade.l{left:0;top:0;bottom:0;width:540px;background:linear-gradient(90deg,rgba(5,9,16,.86) 0%,rgba(5,9,16,.5) 55%,transparent 100%)}
.shade.all{inset:0;background:rgba(5,9,16,.55)}
.ttl{position:absolute;z-index:5;display:flex;flex-direction:column;gap:12px}
.ttl .h{filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.ttl .sub{text-shadow:0 2px 10px rgba(0,0,0,.7)}
/* 跟著 3D 位置跑的標籤 */
.trk{position:absolute;left:0;top:0;z-index:5;opacity:0;will-change:transform,opacity}
.trk .tag{position:absolute;left:0;bottom:40px;transform:translateX(-50%)}
.trk i.pin{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 0 6px rgba(45,212,191,.3),0 4px 12px rgba(0,0,0,.5)}
.trk i.stem{position:absolute;left:-1.5px;bottom:9px;width:3px;height:31px;background:linear-gradient(0deg,#2dd4bf,rgba(45,212,191,.2))}

.top{position:absolute;left:60px;right:60px;top:150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;z-index:5}
.pill{display:inline-block;padding:12px 30px;border-radius:999px;font-size:34px;font-weight:800;letter-spacing:.08em;color:#05121a;background:#2dd4bf;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sh{font-size:100px;font-weight:900;line-height:1.14;color:#fff;text-shadow:0 4px 0 rgba(5,9,16,.55),0 10px 40px rgba(0,0,0,.65)}
.ss{font-size:52px;font-weight:700;line-height:1.35;color:#eaf6ff;text-shadow:0 3px 18px rgba(0,0,0,.8)}
.note{font-size:34px;font-weight:600;color:rgba(232,238,247,.85);text-shadow:0 2px 12px rgba(0,0,0,.8)}
.shade.t{height:900px}
.lbl{position:absolute;z-index:5;display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;font-size:44px;font-weight:800;white-space:nowrap;
 background:rgba(10,18,32,.9);border:2px solid rgba(45,212,191,.6);color:#f4f8ff;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.lbl i{width:22px;height:22px;border-radius:50%;flex:none}
.votes{position:absolute;left:80px;right:80px;top:520px;display:flex;flex-direction:column;gap:38px}
.vh{display:flex;align-items:baseline;gap:24px;margin-bottom:14px}.vid{font-size:64px;font-weight:900;color:#2dd4bf;min-width:110px}.vn{font-size:52px;font-weight:800;flex:1}
.cnt{font-size:72px;font-weight:900;font-variant-numeric:tabular-nums}
.bar{height:46px;border-radius:23px;background:rgba(232,238,247,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:23px;background:linear-gradient(90deg,#2dd4bf,#a78bfa);animation:grow 1.1s cubic-bezier(.2,.9,.3,1) var(--bd) forwards}
@keyframes grow{to{width:var(--w)}}
.vrow:first-child .cnt{color:#7ff0df}
.stamp{position:absolute;left:0;right:0;margin:0 auto;width:760px;top:1330px;text-align:center;padding:24px 0;border:8px solid #3fbf6a;border-radius:22px;color:#3fbf6a;font-size:64px;font-weight:900;
 background:rgba(5,12,10,.85);transform:rotate(-6deg);opacity:0;animation:stamp .7s cubic-bezier(.2,1.4,.35,1) 3.3s forwards;box-shadow:0 20px 50px rgba(0,0,0,.5)}
@keyframes stamp{from{opacity:0;transform:rotate(-6deg) scale(2)}to{opacity:1;transform:rotate(-6deg) scale(1)}}</style></head>
<body style="--dur:5.5s">
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>

<div class="stage">

<div class="top" style="top:200px"><div class="pill pop" style="--d:.1s">投票結果</div><div class="sh pop" style="--d:.3s">辦公室要怎麼改？</div></div>
<div class="votes"><div class="vrow in" style="--d:0.60s"><div class="vh"><span class="vid">B+</span><span class="vn">會議／試播室</span><b class="cnt" data-v="10" data-d="0.90">0</b></div><div class="bar"><i style="--w:100%;--bd:0.90s"></i></div></div><div class="vrow in" style="--d:0.82s"><div class="vh"><span class="vid">D</span><span class="vn">錄課棚</span><b class="cnt" data-v="8" data-d="1.12">0</b></div><div class="bar"><i style="--w:80%;--bd:1.12s"></i></div></div><div class="vrow in" style="--d:1.04s"><div class="vh"><span class="vid">A</span><span class="vn">辦公室升級</span><b class="cnt" data-v="3" data-d="1.34">0</b></div><div class="bar"><i style="--w:30%;--bd:1.34s"></i></div></div><div class="vrow in" style="--d:1.26s"><div class="vh"><span class="vid">C</span><span class="vn">茶水間</span><b class="cnt" data-v="1" data-d="1.56">0</b></div><div class="bar"><i style="--w:10%;--bd:1.56s"></i></div></div></div>
<div class="stamp">老師核准 A・B+・D</div>
<script>
const cs=[...document.querySelectorAll('.cnt')];
function tick(){const t=performance.now()/1000;for(const c of cs){const v=+c.dataset.v,d=+c.dataset.d;const k=Math.min(1,Math.max(0,(t-d)/1.1));c.textContent=Math.round(v*(1-Math.pow(1-k,3)));}requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script>
</div>

<div class="vig"></div>

</body></html>
